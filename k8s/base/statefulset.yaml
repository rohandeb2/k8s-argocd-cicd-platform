apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: training-cache
  namespace: devops-training
  labels:
    app: training-cache
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceName: training-cache-headless         
  replicas: 2
  selector:
    matchLabels:
      app: training-cache
  updateStrategy:
    type: RollingUpdate                       
    rollingUpdate:
      partition: 0                            
  podManagementPolicy: OrderedReady           
  template:
    metadata:
      labels:
        app: training-cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                        
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --save                          
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data                       
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: tmp-dir
          emptyDir: {}
  volumeClaimTemplates:                       
    - metadata:
        name: data                          
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi                   
        
---

apiVersion: v1
kind: Service
metadata:
  name: training-cache-headless
  namespace: devops-training
  labels:
    app: training-cache
  annotations:
    argocd.argoproj.io/sync-wave: "1"          
spec:
  clusterIP: None                              
  selector:
    app: training-cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---

apiVersion: v1
kind: Service
metadata:
  name: training-cache-svc
  namespace: devops-training
  labels:
    app: training-cache
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: training-cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP

