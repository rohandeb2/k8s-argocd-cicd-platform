apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secret.yaml
  - service.yaml
  - deployment.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: training-app-config
    literals:
      - APP_VERSION=v1.0.0
      - ENVIRONMENT=base
      - LOG_LEVEL=info

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      managed-by: kustomize
      project: devops-training
    includeSelectors: false
