apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: training-app-vpa
  namespace: devops-training
  annotations:
    argocd.argoproj.io/sync-wave: "3"          
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: training-app

  updatePolicy:
    updateMode: "Off"

  resourcePolicy:
    containerPolicies:
      - containerName: training-app
        minAllowed:
          cpu: 25m                             
          memory: 32Mi
        maxAllowed:
          cpu: 500m                           
          memory: 256Mi
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits    