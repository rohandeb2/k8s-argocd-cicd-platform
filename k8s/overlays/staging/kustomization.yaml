apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-training-staging
resources:
  - ../../base
images:
  - name: training-app
    newName: rohan700/training-app
    newTag: latest
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: training-app
configMapGenerator:
  - name: training-app-config
    behavior: merge
    literals:
      - APP_VERSION=v1.0.0-staging
      - ENVIRONMENT=staging
      - LOG_LEVEL=info
generatorOptions:
  disableNameSuffixHash: true
