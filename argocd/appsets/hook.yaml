apiVersion: batch/v1
kind: Job
metadata:
  name: pre-sync-migration
  namespace: devops-training
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation   
    argocd.argoproj.io/sync-wave: "-1"                         
spec:
  ttlSecondsAfterFinished: 120             
  backoffLimit: 2                          
  template:
    metadata:
      labels:
        app: pre-sync-migration
        argocd.argoproj.io/hook: PreSync
    spec:
      serviceAccountName: training-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Checking database connection"
              sleep 2
              echo "Running migrations"
              sleep 1
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---

apiVersion: batch/v1
kind: Job
metadata:
  name: post-sync-smoke-test
  namespace: devops-training
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"        
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: post-sync-smoke-test
        argocd.argoproj.io/hook: PostSync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for app to be ready"
              sleep 5

              echo "Testing /healthz..."
              wget -qO- http://training-app-svc.devops-training.svc.cluster.local/healthz

              if [ $? -ne 0 ]; then
                echo "FAIL"
                exit 1
              fi
              echo "PASS"

              echo "Testing /readyz"
              wget -qO- http://training-app-svc.devops-training.svc.cluster.local/readyz

              if [ $? -ne 0 ]; then
                echo "FAIL"
                exit 1
              fi
              echo "PASS"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# ── SyncFail: runs only when sync fails ───────────────────────
# Use case: send alert, rollback, clean up partially applied resources
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-fail-alert
  namespace: devops-training
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: sync-fail-alert
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: alert
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=== SYNC FAILED ==="
              echo "App: training-app"
              echo "Time: $(date)"
              echo "Action: In real setup, send Slack/PagerDuty alert here"
              # curl -X POST $SLACK_WEBHOOK -d '{"text":"Sync failed for training-app!"}'
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]