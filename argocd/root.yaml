apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: root-app
    tier: management
spec:
  project: default
  source:
    repoURL: https://github.com/rohandeb2/k8s-argocd-cicd-platform.git   
    targetRevision: main
    path: argocd/apps                         
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                          
  syncPolicy:
    automated:
      prune: true                             
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

